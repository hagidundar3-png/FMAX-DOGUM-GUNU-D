<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhammed Furkan - Doğum Günü Özel Sitem</title>
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      // 1. PUBLIC KEY'İNİ BURAYA YAPIŞTIR
      emailjs.init("R6xeaKVwmNn-JJY1Q");
    })();
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      margin-top: 0;
      color: #38bdf8;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background-color: #0284c7;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Bana Bir Not Bırak 📝</h2>
    <form id="contact-form">
      <div class="form-group">
        <label for="user_name">Adın / Takma Adın:</label>
        <input type="text" name="user_name" id="user_name" required placeholder="Örn: Ahmet">
      </div>
      <div class="form-group">
        <label for="message">Mesajın:</label>
        <textarea name="message" id="message" rows="4" required placeholder="İyi ki doğdun kanka!"></textarea>
      </div>
      <button type="submit" id="btn-submit">Notu Gönder 🚀</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('contact-form');
    const statusDiv = document.getElementById('status');
    const btn = document.getElementById('btn-submit');

    form.addEventListener('submit', function(event) {
      event.preventDefault();
      btn.innerText = 'Gönderiliyor... ⏳';

      // 2. SERVICE ID VE TEMPLATE ID'Nİ BURAYA YAPIŞTIR
      const serviceID = 'service_uxg18as';
      const templateID = 'template_hvxj7tb';

      emailjs.sendForm(serviceID, templateID, this)
        .then(() => {
          btn.innerText = 'Notu Gönder 🚀';
          statusDiv.style.color = '#4ade80';
          statusDiv.innerText = 'Mesajın başarıyla ulaştı! 🎉';
          form.reset();
        }, (err) => {
          btn.innerText = 'Notu Gönder 🚀';
          statusDiv.style.color = '#f87171';
          statusDiv.innerText = 'Hata oluştu! Bilgileri kontrol et.';
          console.error('EmailJS Hata:', err);
        });
    });
  </script>

</body>
</html>
